
name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Packaged Python Engine
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name SmartDocumentConverterEngine --paths . --collect-all fitz --collect-all pymupdf engine_entry.py

      - name: Verify Packaged Engine
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SmartDocumentConverterEngine/SmartDocumentConverterEngine.exe")) {
            throw "Python Engine executable was not generated"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri Installers
        working-directory: src-tauri
        run: npx --prefix ../frontend tauri build

      - name: Verify Installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"

          if (!$msi) { throw "MSI installer was not generated" }
          if (!$exe) { throw "NSIS installer was not generated" }

          Write-Host "MSI: $($msi.FullName)"
          Write-Host "EXE: $($exe.FullName)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-document-converter-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
